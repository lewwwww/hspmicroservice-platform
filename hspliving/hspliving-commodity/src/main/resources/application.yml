spring:
  datasource:
    username: root
    password: root
    url: jdbc:mysql://127.0.0.1:3306/hspliving_commodity?useUnicode=true&characterEncoding=utf-8&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
  cloud:
    alicloud:
      oss:
        endpoint: oss-cn-beijing.aliyuncs.com
      # 密钥已从代码中移除，请通过环境变量注入：ALICLOUD_ACCESS_KEY / ALICLOUD_SECRET_KEY
      access-key: ${ALICLOUD_ACCESS_KEY:}
      secret-key: ${ALICLOUD_SECRET_KEY:}

    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 #配置nacos的地址ip加端口
  application:
    name: hspliving-commodity
  #1. 关闭thymeleaf的缓存, 这样当前端页面变化时，就可以看到效果
  #2. 在实际的生产环境, 需要将cache 设置为true ,开启缓存,提高效率
  thymeleaf:
    cache: false

#配置mybatis-plus
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto #配置主键自增
      logic-delete-value: 0 #逻辑删除值(默认是1, 这里调整成自己的)
      logic-not-delete-value: 1 #逻辑未删除值(默认是0, 这里调整成自己的)
  configuration:
    #这里我们配置输出底层的sql,方便我们观察sql
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
