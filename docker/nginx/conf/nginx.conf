# hspliving Nginx 配置（可选，仅当用 www.hspliving.com 域名部署商城首页时启用）
# 已通过 docker-compose.yml 挂载到容器 /etc/nginx
#
# 注意：Nginx 在容器内，转发到宿主机上 IDEA 启动的网关(5050)时，
# 需使用 host.docker.internal 指向宿主机（Docker Desktop 已内置该域名）。

user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  www.hspliving.com;

        location / {
            root   /usr/share/nginx/html/hspliving;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://host.docker.internal:5050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
